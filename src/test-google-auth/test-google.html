<!DOCTYPE html>
<html>
<head>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <h2>Google Auth Test</h2>
  <div id="g_id_onload"
       data-client_id="494200082233-9e6l15v2jgc05bqh27s3fdtht310dvhc.apps.googleusercontent.com"
       data-callback="handleCredentialResponse">
  </div>
  <div class="g_id_signin" data-type="standard"></div>

  <pre id="output" style="white-space: pre-wrap; word-break: break-all; margin-top: 20px;"></pre>

  <script>
    function handleCredentialResponse(response) {
      document.getElementById("output").innerText = response.credential;
      console.log("idToken:", response.credential);
    }
  </script>
</body>
</html>
